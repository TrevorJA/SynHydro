name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=synhydro --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Non-editable install, exercised from outside the repository checkout.
  # The editable install above resolves package data through the source
  # tree, so it cannot catch files that are missing from the built wheel.
  install-smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package (non-editable)
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Smoke test the installed package from outside the repo
      run: |
        cd "$RUNNER_TEMP"
        python - <<'PY'
        import synhydro

        print("synhydro", synhydro.__version__)
        Q_daily = synhydro.load_example_data()
        Q_monthly = Q_daily.resample("MS").sum()
        gen = synhydro.KirschGenerator()
        gen.fit(Q_monthly)
        ensemble = gen.generate(n_realizations=2, n_years=5, seed=42)
        print("generated", type(ensemble).__name__)
        PY
